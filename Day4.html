<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        body {
            background-color: #f2f6ff;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        form {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
        }

        label,
        p {
            font-family: Arial, sans-serif;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        button {
            padding: 10px 25px;
            position: relative;
            left: 200px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>Contact Us</h1>

    <form>

        <label for="name">Name: *</label><br>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter Your Name"
            required
        >

        <label for="email">Email: *</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Your Email"
            required
        >

        <label for="subject">Subject: *</label><br>
        <select id="subject" name="subject" required>
            <option value="">-- Select Subject --</option>
            <option value="general">Internship Inquiry</option>
            <option value="feedback">Feedback</option>
            <option value="project">General Inquiry</option>
        </select>

        <p>Preferred Contact Time :</p>

        <input
            type="radio"
            id="Morning"
            name="contact-Time"
            value="Morning"
            required
        >
        <label for="Morning">Morning</label>

        <input
            type="radio"
            id="Evening"
            name="contact-Time"
            value="Evening"
        >
        <label for="Evening">Evening</label>

        <br><br>

        <input
            type="checkbox"
            id="subscribe"
            name="subscribe"
        >
        <label for="subscribe">
            Subscribe to updates
        </label>

        <br><br>

        <label for="message">Message: *</label><br>
        <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Enter your query"
            required
        ></textarea>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
